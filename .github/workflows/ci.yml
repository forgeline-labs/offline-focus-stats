name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dev dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dev dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run black-box tests
        run: python -m pytest
